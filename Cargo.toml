[package]
name = "cooling-display"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Telemetry bridge for the Lovingcool AK-03 USB display"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
libc = "0.2"
nusb = "=0.2.3"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["local-offset"] }
toml = "0.8"
nvml-wrapper = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
